encoding: utf-8

title: "王鲜申's blog"
email: thewangcj@gmail.com
description: "记录 C/C++、Linux、网络协议、工作与个人学习的博客"
lang: zh-CN
timezone: Asia/Shanghai

baseurl: ""
url: https://thewangcj.github.io
twitter_username: thewangcj
github_username: thewangcj

paginate: 6

# 仅用于本地 jekyll-admin，不参与生产站点输出
jekyll_admin:
  show_drafts: true
  hidden_links:
    - pages
  homepage: "posts"

feed:
  posts_limit: 5

# Markdown and syntax highlighting
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"
    tab_width: 2
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1


plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

excerpt_separator: <!--more-->



